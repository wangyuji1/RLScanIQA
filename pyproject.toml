[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-scaniqa"
version = "0.1.0"
description = "Reinforcement-learned scanpaths for blind 360-degree image quality assessment"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Yujia Wang"},
  {name = "Yuyan Li"},
  {name = "Jiuming Liu"},
  {name = "Fang-Lue Zhang"},
  {name = "Xinhu Zheng"},
  {name = "Neil A. Dodgson"},
]
keywords = ["360 image quality assessment", "reinforcement learning", "scanpath", "PPO", "computer vision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.7",
  "Pillow>=9.0",
  "torch>=1.12",
  "torchvision>=0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.urls]
Paper = "https://arxiv.org/abs/2603.14297"
Repository = "https://github.com/wangyuji1/RLScanIQA"

[tool.setuptools.packages.find]
include = ["rl_scaniqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
